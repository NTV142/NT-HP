<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>
  <style>
    .video-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; object-fit: contain; }
    video { display: none; }
    
    .controls { position: absolute; z-index: 10; }
    button {
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 5px;
      border: none;
      background: #fff;
      font-weight: bold;
    }
    #fs_btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      padding: 8px 12px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="video-container" id="main_view">
  <div class="controls">
    <button id="start_btn">カメラを起動して解析開始</button>
  </div>
  <canvas id="output_canvas"></canvas>
  <button id="fs_btn" style="display:none;">全画面</button>
</div>

<video id="input_video" playsinline></video>

<script type="module">
  const video = document.getElementById('input_video');
  const canvas = document.getElementById('output_canvas');
  const startBtn = document.getElementById('start_btn');
  const fsBtn = document.getElementById('fs_btn');
  const container = document.getElementById('main_view');
  const ctx = canvas.getContext('2d');

  const selfieSegmentation = new SelfieSegmentation({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
  });

  selfieSegmentation.setOptions({ modelSelection: 1 });
  selfieSegmentation.onResults((results) => {
    canvas.width = results.image.width;
    canvas.height = results.image.height;
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // マスク描画
    ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
    
    // 背景を緑に
    ctx.globalCompositeOperation = 'source-out';
    ctx.fillStyle = '#00FF00';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 人物を描画
    ctx.globalCompositeOperation = 'destination-atop';
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  });

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
      video.srcObject = stream;
      await video.play();
      
      startBtn.style.display = 'none';
      fsBtn.style.display = 'block';
      
      predict();
    } catch (err) {
      alert("カメラの起動に失敗しました: " + err);
    }
  }

  async function predict() {
    await selfieSegmentation.send({image: video});
    requestAnimationFrame(predict);
  }

  startBtn.addEventListener('click', startCamera);

  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      container.requestFullscreen().catch(err => alert(err.message));
    } else {
      document.exitFullscreen();
    }
  });
</script>
</body>
</html>
