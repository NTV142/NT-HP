<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>
  <style>
    .video-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas { width: 100%; height: 100%; object-fit: contain; }
    video { display: none; }
    
    /* ボタン類 */
    .controls {
      position: absolute;
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 12px 20px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: rgba(255,255,255,0.8);
    }
    #fs_btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      padding: 8px 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="video-container" id="main_view">
  <div class="controls" id="ui_layer">
    <button id="start_btn">映像解析を開始</button>
  </div>
  <canvas id="output_canvas"></canvas>
  <button id="fs_btn" style="display:none;">全画面</button>
</div>

<video id="input_video" src="video.mp4" loop muted playsinline></video>

<script type="module">
  const video = document.getElementById('input_video');
  const canvas = document.getElementById('output_canvas');
  const startBtn = document.getElementById('start_btn');
  const fsBtn = document.getElementById('fs_btn');
  const container = document.getElementById('main_view');
  const ctx = canvas.getContext('2d');

  const selfieSegmentation = new SelfieSegmentation({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
  });

  selfieSegmentation.setOptions({ modelSelection: 1 });
  selfieSegmentation.onResults((results) => {
    canvas.width = results.image.width;
    canvas.height = results.image.height;
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-out';
    ctx.fillStyle = '#00FF00';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'destination-atop';
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  });

  async function predict() {
    if(!video.paused) {
      await selfieSegmentation.send({image: video});
    }
    requestAnimationFrame(predict);
  }

  startBtn.addEventListener('click', () => {
    video.play();
    startBtn.style.display = 'none';
    fsBtn.style.display = 'block';
    predict();
  });

  // 全画面切り替え
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      container.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });
</script>
</body>
</html>
