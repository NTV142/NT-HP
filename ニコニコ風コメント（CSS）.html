<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    background: #222 !important; /* 動作確認用に一時的に背景色を入れています */
    color: #FAFAFA;
    font-size: 50px;
    margin: 0;
    overflow: hidden;
    height: 100%;
}

#log {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    padding: 0;
    box-sizing: border-box;
}

.chat-item {
    position: absolute !important;
    white-space: nowrap !important;
    animation: scroll-right-to-left 10s linear forwards !important;
    font-family: sans-serif;
    font-weight: bold;
}

.name {
    color: #FF5555 !important;
    font-weight: 700;
    margin-right: 1em;
}

.message {
    display: inline-block;
}

@keyframes scroll-right-to-left {
    0% { transform: translateX(100vw); }
    100% { transform: translateX(-100%); }
}
</style>
</head>
<body>
    <div id="log"></div>
    <div id="debug" style="position:fixed; top:0; left:0; color:yellow; font-size:20px; z-index:9999;">Status: Connecting...</div>

    <script>
        const channelName = "ntsanch";
        const debug = document.getElementById('debug');

        const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        ws.onopen = () => {
            debug.innerText = "Status: Connected. Joining #" + channelName;
            ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
            ws.send('NICK justinfan' + Math.floor(Math.random() * 80000));
            ws.send('JOIN #' + channelName);
        };

        ws.onmessage = (event) => {
            const data = event.data;
            if (data.startsWith('PING')) {
                ws.send('PONG :tmi.twitch.tv');
                return;
            }

            // 受信した生データをデバッグ表示してみる
            if (data.includes('PRIVMSG')) {
                const matchName = data.match(/:([^!]+)!/);
                const matchMsg = data.match(/PRIVMSG #[^ ]+ :(.+)/);

                if (matchName && matchMsg) {
                    const name = matchName[1];
                    const text = matchMsg[1].trim();
                    createScrollingText(name, text);
                }
            }
        };

        ws.onerror = (error) => {
            debug.innerText = "Status: Error occurred";
        };

        function createScrollingText(name, text) {
            const log = document.getElementById('log');
            const div = document.createElement('div');
            div.className = 'chat-item';
            
            const randomTop = Math.random() * (window.innerHeight - 100);
            div.style.top = randomTop + 'px';

            div.innerHTML = `<span class="name">${name}</span><span class="message">${text}</span>`;
            log.appendChild(div);

            setTimeout(() => {
                div.remove();
            }, 10000);
        }
    </script>
</body>
</html>
