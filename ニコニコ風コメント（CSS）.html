<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    background: transparent !important;
    color: #FAFAFA;
    font-size: 80px;
    margin: 0;
    overflow: hidden;
    height: 100%;
}

#log {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    padding: 0;
    box-sizing: border-box;
}

.chat-item {
    position: absolute !important;
    white-space: nowrap !important;
    animation: scroll-right-to-left 10s linear forwards !important;
    -webkit-animation: scroll-right-to-left 10s linear forwards !important;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: bold;
}

.name {
    color: #FAFAFA !important;
    font-weight: 700;
    margin-right: 1em;
}

.message {
    display: inline-block;
}

@keyframes scroll-right-to-left {
    0% { transform: translateX(100vw); }
    100% { transform: translateX(-100%); }
}

@-webkit-keyframes scroll-right-to-left {
    0% { -webkit-transform: translateX(100vw); }
    100% { -webkit-transform: translateX(-100%); }
}
</style>
</head>
<body>
    <div id="log"></div>

    <!-- StreamlabsのSocket API用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // あなたのStreamlabsのトークン（URLのtoken=以降、またはソケットトークン）
        // ※Socket用トークンはStreamlabsのダッシュボードのAPI Settings等から取得できます
        const token = "YOUR_SOCKET_TOKEN"; 
        const socket = io(`https://sockets.streamlabs.com?token=${token}`, { transports: ['websocket'] });

        socket.on('event', (event) => {
            if (!event.for === 'twitch_account') return;
            
            if (event.type === 'donation') {
                // 投げ銭などの処理（必要に応じて）
            }
            
            // チャットメッセージのイベント
            if (event.type === 'chat') {
                event.message.forEach(msg => {
                    createScrollingText(msg.name, msg.message);
                });
            }
        });

        function createScrollingText(name, text) {
            const log = document.getElementById('log');
            const div = document.createElement('div');
            div.className = 'chat-item';
            
            // 画面の縦方向のランダムな位置に流す場合（必要なら調整）
            const randomTop = Math.random() * (window.innerHeight - 150);
            div.style.top = randomTop + 'px';

            div.innerHTML = `<span class="name">${name}</span><span class="message">${text}</span>`;
            log.appendChild(div);

            // アニメーション終了後に要素を削除
            setTimeout(() => {
                div.remove();
            }, 10000);
        }
    </script>
</body>
</html>
