<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    background: transparent !important;
    color: #FAFAFA;
    font-size: 80px;
    margin: 0;
    overflow: hidden;
    height: 100%;
}

#log {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    padding: 0;
    box-sizing: border-box;
}

#log .name {
    color: #FAFAFA !important;
    font-weight: 700;
    margin-left: 0.1em;
    margin-right: 1em;
}

#log .badge, 
#log .badges, 
#log .colon {
    display: none !important;
}

#log > div {
    position: absolute !important;
    white-space: nowrap !important;
    animation: scroll-right-to-left 10s linear forwards !important;
    -webkit-animation: scroll-right-to-left 10s linear forwards !important;
}

@keyframes scroll-right-to-left {
    0% {
        transform: translateX(100vw);
    }
    100% {
        transform: translateX(-100%);
    }
}

@-webkit-keyframes scroll-right-to-left {
    0% {
        -webkit-transform: translateX(100vw);
    }
    100% {
        -webkit-transform: translateX(-100%);
    }
}

#log .message {
    display: inline-block;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: bold;
}
</style>
</head>
<body>
    <iframe src="https://streamlabs.com/widgets/chat-box/v1/6F6DFAAC7000990EBA9F3C223CCAFB5FCCCF28FB8E9297C80996D13F67F75CB59BDA2F4C34690D0D1F0C17ECF4C26EA593247633DBE0686EA2A936F7BC2EB167BED121137B4DB3B0500DCCA77B9AC3A1A49524D44D7CC778C5B19CA868A5B4D480CA8461777D81B5C07B36679EE97E4E12348100351C7CA80D35564FB1" style="border:none; width:100%; height:100%; background:transparent; position:absolute; top:0; left:0; z-index:999;"></iframe>
    <div id="log"></div>
</body>
</html>
