<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    background: transparent !important;
    color: #FAFAFA;
    font-size: 80px;
    margin: 0;
    overflow: hidden;
    height: 100%;
    user-select: none;
}

body.black-mode {
    color: #000000 !important;
}

#log {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    padding: 0;
    box-sizing: border-box;
}

.chat-item {
    position: absolute !important;
    white-space: nowrap !important;
    animation: scroll-right-to-left 10s linear forwards !important;
    -webkit-animation: scroll-right-to-left 10s linear forwards !important;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: bold;
}

.name {
    color: #FAFAFA !important;
    font-weight: 700;
    margin-right: 1em;
}

body.black-mode .name {
    color: #000000 !important;
}

.message {
    display: inline-block;
}

@keyframes scroll-right-to-left {
    0% { transform: translateX(100vw); }
    100% { transform: translateX(-100%); }
}

@-webkit-keyframes scroll-right-to-left {
    0% { -webkit-transform: translateX(100vw); }
    100% { -webkit-transform: translateX(-100%); }
}
</style>
</head>
<body>
    <div id="log"></div>

    <script>
        const channelName = "ntsanch";

        // 切り替え処理を共通化
        function toggleColorMode() {
            document.body.classList.toggle('black-mode');
        }

        // Cキーで切り替え
        document.addEventListener('keydown', (event) => {
            if (event.key === 'c' || event.key === 'C') {
                toggleColorMode();
            }
        });

        // ダブルクリック（ダブルタップ）で切り替え
        document.addEventListener('dblclick', () => {
            toggleColorMode();
        });

        const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        ws.onopen = () => {
            ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
            ws.send('NICK justinfan' + Math.floor(Math.random() * 80000));
            ws.send('JOIN #' + channelName);
        };

        ws.onmessage = (event) => {
            const data = event.data;
            if (data.startsWith('PING')) {
                ws.send('PONG :tmi.twitch.tv');
                return;
            }

            if (data.includes('PRIVMSG')) {
                const matchName = data.match(/:([^!]+)!/);
                const matchMsg = data.match(/PRIVMSG #[^ ]+ :(.+)/);

                if (matchName && matchMsg) {
                    const name = matchName[1];
                    const text = matchMsg[1].trim();
                    createScrollingText(name, text);
                }
            }
        };

        function createScrollingText(name, text) {
            const log = document.getElementById('log');
            const div = document.createElement('div');
            div.className = 'chat-item';
            
            const randomTop = Math.random() * (window.innerHeight - 150);
            div.style.top = randomTop + 'px';

            div.innerHTML = `<span class="name">${name}</span><span class="message">${text}</span>`;
            log.appendChild(div);

            setTimeout(() => {
                div.remove();
            }, 10000);
        }
    </script>
</body>
</html>
