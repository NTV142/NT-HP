<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="NT.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <title>NT-HP | NT公式リンク集</title>
    <meta name="description" content="インフルエンサーNTの公式ホームページです。">

    <style>
        /* --- 基本設定 --- */
        body { font-family: sans-serif; margin: 0; padding-top: 60px; background-color: #f9f9f9; }
        h1 { font-size: 5vw; text-align: center; }

        /* --- メニュー全体の親要素（ここがホバーの判定範囲） --- */
        .nav-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            height: 100%; /* 縦長に判定を作る */
        }

        /* 三本線ボタン */
        .menu-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1002;
        }

        .menu-btn span {
            display: block;
            width: 25px;
            height: 3px;
            background: white;
            margin: 3px 0;
            border-radius: 2px;
        }

        /* 隠れているメニュー */
        #menu-content {
            position: absolute;
            top: 0;
            left: -250px; /* 完全に隠す */
            width: 220px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            padding-top: 80px;
            transition: all 0.4s ease; /* 滑らかアニメーション */
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 1001;
        }

        /* ★最強のホバー設定：親要素にマウスが乗ったら中身を出す★ */
        .nav-container:hover #menu-content {
            left: 0;
        }

        /* スマホ用（クリックでも開くように） */
        #menu-content.open {
            left: 0;
        }

        #menu-content a {
            display: block;
            padding: 20px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-bottom: 1px solid #333;
        }

        #menu-content a:hover { background: #444; }
