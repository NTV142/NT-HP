<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="NT.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <title>NT-HP | NT公式リンク集</title>
    <meta name="description" content="インフルエンサーNTの公式ホームページです。">

    <style>
        /* --- 基本設定 --- */
        body { font-family: sans-serif; margin: 0; padding-top: 80px; background-color: #f9f9f9; }
        h1 { font-size: 5vw; text-align: center; }

        /* --- ナビゲーション全体の親 --- */
        .nav-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            width: 60px;
            height: 100px;
        }

        /* 三本線ボタン */
        .menu-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1002;
        }

        .menu-btn span {
            display: block;
            width: 25px;
            height: 3px;
            background: white;
            margin: 3px 0;
            border-radius: 2px;
        }

        /* 隠れているメニュー */
        #menu-content {
            position: fixed;
            top: 0;
            left: -250px;
            width: 220px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            padding-top: 80px;
            transition: all 0.4s ease;
            z-index: 1001;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        /* マウスを乗せたら表示 */
        .nav-container:hover #menu-content {
            left: 0;
        }

        /* スマホ・クリック用 */
        #menu-content.open {
            left: 0;
        }

        #menu-content a {
            display: block;
            padding: 20px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-bottom: 1px solid #333;
        }

        #menu-content a:hover {
            background: #444;
        }

        /* --- SNSリンク用CSS --- */
        .koutyou-img { display: block; margin: 20px auto; width: 80%; max-width: 300px; height: auto; border-radius: 15px; }
        .sns-row { display: flex; width: 100%; margin: 10px 0; justify-content: center; }
        .sns-row a { flex-grow: 1; text-align: center; }
        .sns-row img { width: 90%; height: auto; max-width: 120px; transition: transform 0.2s; }
        .sns-row img:hover { transform: scale(1.1); }
    </style>
</head>

<body>

    <div class="nav-container">
        <div class="menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav id="menu-content">
            <a href="index.html">ホーム</a>
            <a href="gallery.html">ギャラリー</a>
        </nav>
    </div>

    <h1>SNSのリンク集<br>フォローよろしく！</h1>

    <a href='https://www.metro.ed.jp/kuramaekoka-h/'>
        <img src='koutyou.jpg' class='koutyou-img' alt="画像1">
    </a>
    <img src='NT.png' class='koutyou-img' alt="画像2">

    <div class="sns-row">
        <a href='https://www.tiktok.com/@ntv142'><img src='①TikTok.png' alt='TikTok'></a>
        <a href='https://www.youtube.com/@ntv142'><img src='②YouTube.png' alt='YouTube'></a>
    </div>

    <div class="sns-row">
        <a href='https://twitter.com/NTV142'><img src='③X.png' alt='X'></a>
        <a href='https://www.twitch.tv/ntsanch'><img src='④Instagram.png' alt='Twitch 1'></a>
        <a href='https://www.twitch.tv/ntsanch'><img src='⑤Twitch.png' alt='Twitch 2'></a>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu-content');
            menu.classList.toggle('open');
        }
    </script>

</body>
</html>
