<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="NT.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <title>NT-HP | NT公式リンク集</title>
    <meta name="description" content="インフルエンサーNTの公式ホームページです。">

    <style>
        /* --- 基本設定 --- */
        body { font-family: sans-serif; margin: 0; padding-top: 60px; }
        h1 { font-size: 5vw; text-align: center; }

        /* --- ハンバーガーメニューのデザイン --- */
        .menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 1000;
            background: #333; /* わかりやすく背景を黒にしました */
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        /* 三本線を作る */
        .menu-btn span {
            display: block;
            width: 25px;
            height: 3px;
            background: white;
            margin: 3px 0;
            transition: 0.3s;
        }

        /* 隠れているメニューリスト */
        #menu-content {
            display: none; /* 最初は隠す */
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding-top: 70px;
            z-index: 999;
        }
        #menu-content a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-bottom: 1px solid #444;
        }

        /* --- SNSリンク用CSS (既存) --- */
        .koutyou-img { display: block; margin: 20px auto; width: 80%; max-width: 300px; height: auto; }
        .sns-row { display: flex; width: 100%; margin: 10px 0; justify-content: center; }
        .sns-row a { flex-grow: 1; text-align: center; }
        .sns-row img { width: 90%; height: auto; max-width: 120px; }
    </style>
</head>

<body>

    <div class="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav id="menu-content">
        <a href="index.html" onclick="toggleMenu()">ホーム</a>
        <a href="gallery.html">スライドショー</a>
    </nav>

    <h1>SNSのリンク集<br>フォローよろしく！</h1>

    <a href='https://www.metro.ed.jp/kuramaekoka-h/'>
        <img src='koutyou.jpg' class='koutyou-img' alt="蔵前工科高校リンク">
    </a>
    <img src='NT.png' class='koutyou-img' alt="NTアイコン">

    <div class="sns-row">
        <a href='https://www.tiktok.com/@ntv142'><img src='①TikTok.png' alt='TikTok'></a>
        <a href='https://www.youtube.com/@ntv142'><img src='②YouTube.png' alt='YouTube'></a>
    </div>

    <div class="sns-row">
        <a href='https://twitter.com/NTV142'><img src='③X.png' alt='X'></a>
        <a href='https://www.twitch.tv/ntsanch'><img src='④Instagram.png' alt='Twitch'></a>
        <a href='https://www.twitch.tv/ntsanch'><img src='⑤Twitch.png' alt='Twitchライブ'></a>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu-content');
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'block';
            }
        }
    </script>

</body>
</html>
