<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="NT.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <title>NT-HP | NT公式リンク集 (TikTok, YouTube, X, Twitch)</title>
    <meta name="description" content="インフルエンサーNTの公式ホームページです。TikTok、YouTube、X、Twitchなどの最新リンクをまとめています。フォローよろしくお願いします！">

    <style>
        /* ------------------------------------- */
        /* 1. H1の文字サイズを画面幅に合わせる */
        /* ------------------------------------- */
        h1 {
            font-size: 5vw; 
            text-align: center;
        }

        /* ------------------------------------- */
        /* 2. サイトのアイコン画像のサイズ調整 */
        /* ------------------------------------- */
        .koutyou-img {
            display: block;
            margin: 20px auto;
            width: 80%;
            max-width: 300px;
            height: auto;
        }

        /* ------------------------------------- */
        /* 3. SNSコンテナの設定 */
        /* ------------------------------------- */
        .sns-row { 
            display: flex;
            width: 100%;       
            margin: 10px 0;
            justify-content: center; /* 中央寄せを追加 */
        }

        .sns-row a { 
            flex-grow: 1;      
            text-align: center;
        }

        .sns-row img {
            width: 90%;
            height: auto;
            max-width: 120px;
        }
    </style>
</head>

<body>
<div class="menu-btn" onclick="toggleMenu()">
    <span></span>
</div>

<nav id="menu-content">
    <a href="index.html">ホーム</a>
    <a href="gallery.html">スライドショー（ギャラリー）</a>
</nav>

<script>
function toggleMenu() {
    const menu = document.getElementById('menu-content');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}
</script>
<h1>SNSのリンク集<br>フォローよろしく！</h1>

<img src='NT.png' class='koutyou-img' alt="NTアイコン">

<div class="sns-row">
    <a href='https://www.tiktok.com/@ntv142'>
        <img src='①TikTok.png' alt='TikTok'>
    </a>
    <a href='https://www.youtube.com/@ntv142'>
        <img src='②YouTube.png' alt='YouTube'>
    </a>
</div>

<div class="sns-row">
    <a href='https://twitter.com/NTV142'>
        <img src='③X.png' alt='X'>
    </a>
    <a href='https://www.twitch.tv/ntsanch'>
        <img src='④Instagram.png' alt='Twitch'>
    </a>
    <a href='https://www.twitch.tv/ntsanch'>
        <img src='⑤Twitch.png' alt='Twitchライブ'>
    </a>
</div>

</body>
</html>
