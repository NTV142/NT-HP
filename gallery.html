<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT-HP ギャラリー</title>
    <style>
        body { background: #f4f4f4; margin: 0; font-family: sans-serif; text-align: center; overflow-x: hidden; }
        h1 { padding: 20px; color: #333; }

        /* スライダー全体の枠（窓の役割） */
        .slideshow-container {
            max-width: 800px;
            position: relative;
            margin: auto;
            overflow: hidden; /* はみ出た画像を見せなくする */
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background: #fff;
        }

        /* 画像を横一列に並べるためのコンテナ */
        .slide-wrapper {
            display: flex; /* 横並びにする */
            transition: transform 0.6s cubic-bezier(0.45, 0, 0.55, 1); /* 滑らかな動き */
            width: 100%;
        }

        /* 各スライド */
        .slide {
            min-width: 100%; /* 1枚がコンテナと同じ幅になるように固定 */
            box-sizing: border-box;
        }
        
        .slide img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            vertical-align: middle;
        }

        /* 下のドットボタン */
        .dot-container {
            text-align: center;
            padding: 20px;
        }
        .dot {
            cursor: pointer;
            height: 12px;
            width: 12px;
            margin: 0 8px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .active, .dot:hover {
            background-color: #ff0050;
            transform: scale(1.3);
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>NT GALLERY</h1>

    <div class="slideshow-container">
        <div class="slide-wrapper" id="slideWrapper">
            <div class="slide"><img src="koutyou.jpg" alt="1"></div>
            <div class="slide"><img src="NT.png" alt="2"></div>
            </div>
    </div>

    <div class="dot-container">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
    </div>

    <a href="index.html" class="back-btn">ホームへ戻る</a>

    <script>
        let slideIndex = 1;
        let timer;
        const wrapper = document.getElementById('slideWrapper');
        const slides = document.getElementsByClassName("slide");
        const dots = document.getElementsByClassName("dot");

        showSlides(slideIndex);
        startTimer();

        function startTimer() {
            timer = setInterval(() => {
                plusSlides(1);
            }, 4000);
        }

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function currentSlide(n) {
            clearInterval(timer);
            showSlides(slideIndex = n);
            startTimer();
        }

        function showSlides(n) {
            if (n > slides.length) {slideIndex = 1}    
            if (n < 1) {slideIndex = slides.length}
            
            // ★ここが重要：横にずらす計算★
            // 1枚目なら 0%、2枚目なら -100% 動かす
            let translateValue = -(slideIndex - 1) * 100;
            wrapper.style.transform = `translateX(${translateValue}%)`;
            
            // ドットの更新
            for (let i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            dots[slideIndex-1].className += " active";
        }
    </script>

</body>
</html>
