<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT-HP ギャラリー</title>
    <style>
        body { 
            background: #000; 
            color: white; 
            text-align: center; 
            font-family: sans-serif; 
            margin: 0;
            padding: 20px;
        }
        
        /* 画像のスタイル */
        .single-img {
            width: 90%;
            max-width: 500px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            margin-bottom: 30px;
        }

        /* ボタンのスタイル */
        .action-btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: #ff0050; /* TikTok風の赤色 */
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.1);
            background-color: #ff0070;
        }

        /* 戻るボタン */
        .back-link {
            display: block;
            margin-top: 50px;
            color: #aaa;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>ギャラリー</h1>

    <img src="koutyou.jpg" class="single-img" alt="メイン画像">

    <br>

    <a href="https://www.tiktok.com/@ntv142" class="action-btn">
        最新動画をチェック！
    </a>

    <a href="index.html" class="back-link">← ホームへ戻る</a>

</body>
</html>
