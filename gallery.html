<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT-HP ギャラリー</title>
    <style>
        body { background: #f4f4f4; margin: 0; font-family: sans-serif; text-align: center; }
        h1 { padding: 20px; color: #333; }

        /* スライダー全体の枠 */
        .slideshow-container {
            max-width: 800px;
            position: relative;
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background: #fff;
        }

        /* 画像スライド */
        .slide {
            display: none;
        }
        .slide img {
            width: 100%;
            vertical-align: middle;
            height: 400px;
            object-fit: cover;
        }

        /* ★フェードアニメーションをより確実に★ */
        .fade {
            animation: fadeAnime 1s forwards;
        }
        @keyframes fadeAnime {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 下のドットボタン */
        .dot-container {
            text-align: center;
            padding: 20px;
        }
        .dot {
            cursor: pointer;
            height: 12px;
            width: 12px;
            margin: 0 8px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .active, .dot:hover {
            background-color: #ff0050; /* アクティブな時の色 */
            transform: scale(1.3); /* 少し大きくして目立たせる */
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-btn:hover { background: #555; }
    </style>
</head>
<body>

    <h1>NT GALLERY</h1>

    <div class="slideshow-container">
        <div class="slide fade"><img src="koutyou.jpg"></div>
        <div class="slide fade"><img src="NT.png"></div>
    </div>

    <div class="dot-container">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
    </div>

    <a href="index.html" class="back-btn">ホームへ戻る</a>

    <script>
        let slideIndex = 1;
        let timer;
        
        // 最初の表示
        showSlides(slideIndex);
        startTimer();

        function startTimer() {
            timer = setInterval(() => {
                plusSlides(1);
            }, 4000); // 4秒おき
        }

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function currentSlide(n) {
            clearInterval(timer); // 手動操作時に一旦止める
            showSlides(slideIndex = n);
            startTimer(); // 再開
        }

        function showSlides(n) {
            let i;
            let slides = document.getElementsByClassName("slide");
            let dots = document.getElementsByClassName("dot");
            
            if (n > slides.length) {slideIndex = 1}    
            if (n < 1) {slideIndex = slides.length}
            
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            
            // 表示する直前にアニメーションをリセットするため一度消して出す
            slides[slideIndex-1].style.display = "block";  
            dots[slideIndex-1].className += " active";
        }
    </script>

</body>
</html>
