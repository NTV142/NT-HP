<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT-HP ギャラリー</title>
    <style>
        body { background: #f4f4f4; margin: 0; font-family: sans-serif; text-align: center; }
        h1 { padding: 20px; color: #333; }

        /* スライダー全体の枠 */
        .slideshow-container {
            max-width: 800px;
            position: relative;
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* 画像スライド（フェードアニメーション） */
        .slide {
            display: none; /* 最初は全て隠す */
        }
        .slide img {
            width: 100%;
            vertical-align: middle;
            height: 400px;
            object-fit: cover; /* 画像のサイズを揃える */
        }

        /* 下のドットボタンのエリア */
        .dot-container {
            text-align: center;
            padding: 20px;
        }
        .dot {
            cursor: pointer;
            height: 12px;
            width: 12px;
            margin: 0 5px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s ease;
        }
        .active, .dot:hover {
            background-color: #ff0050; /* アクティブな時の色（TikTok風） */
        }

        /* フェード効果 */
        .fade {
            animation-name: fade;
            animation-duration: 1.5s;
        }
        @keyframes fade {
            from {opacity: .4} 
            to {opacity: 1}
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>NT GALLERY</h1>

    <div class="slideshow-container">
        <div class="slide fade"><img src="koutyou.jpg"></div>
        <div class="slide fade"><img src="NT.png"></div>
        </div>

    <div class="dot-container">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        </div>

    <a href="index.html" class="back-btn">ホームへ戻る</a>

    <script>
        let slideIndex = 1;
        let timer;
        showSlides(slideIndex);

        // 自動スライド開始
        startTimer();

        function startTimer() {
            timer = setInterval(function() {
                plusSlides(1);
            }, 4000); // 4秒ごとに次へ
        }

        // 次へ/前への操作用
        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        // ドットをクリックした時の操作
        function currentSlide(n) {
            clearInterval(timer); // 手動操作したら一旦タイマー停止
            showSlides(slideIndex = n);
            startTimer(); // 再開
        }

        function showSlides(n) {
            let i;
            let slides = document.getElementsByClassName("slide");
            let dots = document.getElementsByClassName("dot");
            
            if (n > slides.length) {slideIndex = 1}    
            if (n < 1) {slideIndex = slides.length}
            
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            
            slides[slideIndex-1].style.display = "block";  
            dots[slideIndex-1].className += " active";
        }
    </script>

</body>
</html>
