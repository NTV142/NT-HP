<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT-HP ギャラリー</title>
    <style>
        body { background: #000; color: white; text-align: center; }
        .slideshow-container { max-width: 500px; margin: auto; position: relative; }
        .slide { display: none; }
        img { width: 100%; height: auto; border-radius: 10px; }
        .btn { color: white; background: #333; padding: 10px; text-decoration: none; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>NTギャラリー</h1>

    <div class="slideshow-container">
        <div class="slide"><img src="koutyou.jpg" alt="1"></div>
        <div class="slide"><img src="NT.png" alt="2"></div>
    </div>

    <a href="index.html" class="btn">戻る</a>

    <script>
        let slideIndex = 0;
        showSlides();

        function showSlides() {
            let slides = document.getElementsByClassName("slide");
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            slideIndex++;
            if (slideIndex > slides.length) {slideIndex = 1}    
            slides[slideIndex-1].style.display = "block";  
            setTimeout(showSlides, 3000); // 3秒ごとに切り替え
        }
    </script>
</body>
</html>
