<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NT-Map-Generator</title>
    <style>
        :root { --bg-color: #fe027f; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }
        
        #main-container {
            position: relative; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            display: flex; flex-direction: column;
        }

        /* 画像表示エリア */
        #view-area {
            flex-grow: 1; width: 100%; height: calc(100% - 70px);
            display: grid; opacity: 0.8; z-index: 1; overflow: hidden;
        }
        .bg-icon { width: 100%; height: 100%; object-fit: contain; }

        /* 下部UIバー（ここが表示される窓とボタン） */
        #ui-bar {
            height: 70px; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: space-around;
            z-index: 10; border-top: 1px solid #444; padding: 0 10px;
        }

        .input-group { display: flex; align-items: center; gap: 8px; color: white; }
        
        input[type="number"] {
            width: 80px; height: 40px; font-size: 18px; text-align: center;
            border: none; border-radius: 4px; background: #fff;
        }

        button {
            height: 40px; padding: 0 15px; font-weight: bold; cursor: pointer;
            border: none; border-radius: 4px; transition: 0.2s;
        }

        .btn-val { background: #555; color: white; font-size: 20px; width: 45px; }
        .btn-dl { background: #00ff00; color: black; flex-grow: 1; max-width: 150px; }
        
        button:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="view-area"></div>

        <div id="ui-bar">
            <div class="input-group">
                <button class="btn-val" onclick="changeValue(-1)">-</button>
                <input type="number" id="num-input" value="15" min="1" oninput="setVal(this.value)">
                <button class="btn-val" onclick="changeValue(1)">+</button>
            </div>
            <button class="btn-dl" onclick="saveDirectToSSD()">SSD保存</button>
        </div>
    </div>

    <script>
        const config = { currentValue: 15, bgImagePath: 'image1.jpg', baseSize: 1080 };
        const viewArea = document.getElementById('view-area');
        const numInput = document.getElementById('num-input');
        let currentCols = 0; let currentRows = 0;

        function updateView() {
            viewArea.innerHTML = '';
            const count = parseInt(config.currentValue);
            if (isNaN(count) || count <= 0) return;

            const w = viewArea.clientWidth;
            const h = viewArea.clientHeight;

            currentCols = Math.ceil(Math.sqrt(count * (w / h)));
            currentRows = Math.ceil(count / currentCols);
            const cellSize = Math.min(w / currentCols, h / currentRows);

            viewArea.style.gridTemplateColumns = `repeat(${currentCols}, ${cellSize}px)`;
            
            for (let i = 0; i < count; i++) {
                const img = document.createElement('img');
                img.src = config.bgImagePath;
                img.className = 'bg-icon';
                viewArea.appendChild(img);
            }
        }

        async function saveDirectToSSD() {
            const count = config.currentValue;
            const canvas = document.createElement('canvas');
            canvas.width = config.baseSize * currentCols;
            canvas.height = config.baseSize * currentRows;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = config.bgImagePath;

            img.onload = async () => {
                for (let i = 0; i < count; i++) {
                    ctx.drawImage(img, (i % currentCols) * config.baseSize, Math.floor(i / currentCols) * config.baseSize, config.baseSize, config.baseSize);
                }
                try {
                    // PCのChrome/EdgeならSSD直書き出し
                    if (window.showSaveFilePicker) {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: `NT_Map_${count}.png`,
                            types: [{ description: 'PNG', accept: {'image/png': ['.png']}}]
                        });
                        const writable = await handle.createWritable();
                        canvas.toBlob(async (blob) => {
                            await writable.write(blob);
                            await writable.close();
                            alert("SSD保存完了");
                        }, 'image/png');
                    } else {
                        // スマホ等の場合は通常DL
                        const link = document.createElement('a');
                        link.download = `NT_Map_${count}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }
                } catch (e) { console.log("保存失敗"); }
            };
        }

        function changeValue(n) {
            config.currentValue = Math.max(1, parseInt(config.currentValue) + n);
            numInput.value = config.currentValue;
            updateView();
        }

        function setVal(v) {
            config.currentValue = Math.max(1, parseInt(v) || 1);
            updateView();
        }

        window.addEventListener('resize', updateView);
        window.onload = updateView;
    </script>
</body>
</html>
