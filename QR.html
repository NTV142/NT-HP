<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner Frame</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #container { position: relative; width: 100vw; height: 60vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        /* 読み取り枠 */
        #guide {
            position: absolute; top: 50%; left: 50%;
            width: 200px; height: 200px;
            margin-top: -100px; margin-left: -100px;
            border: 3px solid #0f0; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }
        #result-list { height: 40vh; overflow-y: auto; padding: 10px; background: #fff; }
        .log-item { border-bottom: 1px dotted #ccc; padding: 8px 0; }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline></video>
    <div id="guide"></div>
    <canvas id="canvas" hidden></canvas>
</div>
<div id="result-list"></div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const list = document.getElementById('result-list');
    let lastCode = "";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; requestAnimationFrame(tick); });

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // 解析用キャンバスのサイズ設定
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 中央の正方形エリア(200px相当)のみ抽出して解析
            const size = Math.min(canvas.width, canvas.height) * 0.5;
            const x = (canvas.width - size) / 2;
            const y = (canvas.height - size) / 2;
            const imageData = ctx.getImageData(x, y, size, size);
            
            const code = jsQR(imageData.data, imageData.width, imageData.height);

            if (code && code.data !== lastCode) {
                lastCode = code.data;
                const lines = code.data.split('\n');
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `<strong>${lines[0]}</strong> / ${lines[1] || ''}`;
                list.prepend(div);
                
                setTimeout(() => { lastCode = ""; }, 1500);
            }
        }
        requestAnimationFrame(tick);
    }
</script>
</body>
</html>
