<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NT-Super-Image-Exporter-V2</title>
    <style>
        :root { --bg-color: #fe027f; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* メインコンテナ */
        #counter-container {
            position: relative; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* アイコン表示エリア */
        #bg-icons-layer {
            flex-grow: 1; width: calc(100% - 20px); height: calc(100% - 80px);
            display: grid; opacity: 0.7; z-index: 1; overflow: hidden; pointer-events: none; margin-top: 10px;
        }
        .bg-icon { width: 100%; height: 100%; object-fit: contain; }

        /* 下部操作パネル */
        #control-panel {
            width: 100%; height: 60px; background: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center; gap: 15px;
            z-index: 20; color: white;
        }
        input[type="number"] {
            width: 100px; height: 35px; font-size: 18px; text-align: center;
            border-radius: 5px; border: none;
        }
        button#dl-btn {
            height: 35px; padding: 0 20px; font-weight: bold; cursor: pointer;
            background: #00ff00; border: none; border-radius: 5px; color: black;
        }
        button#dl-btn:hover { background: #00cc00; }
    </style>
</head>
<body>

    <div id="counter-container">
        <div id="bg-icons-layer"></div>

        <div id="control-panel">
            <label for="num-input">枚数:</label>
            <input type="number" id="num-input" value="15" min="1" oninput="changeValue(this.value)">
            <button id="dl-btn" onclick="saveDirectToSSD()">SSDに保存</button>
        </div>
    </div>

    <script>
        const config = { currentValue: 15, bgImagePath: 'image1.jpg', baseSize: 1080 };
        const bgLayer = document.getElementById('bg-icons-layer');
        const numInput = document.getElementById('num-input');
        let currentCols = 0; let currentRows = 0;

        function updateCounter() {
            bgLayer.innerHTML = '';
            const count = parseInt(config.currentValue);
            if (isNaN(count) || count <= 0) return;

            const availW = bgLayer.clientWidth;
            const availH = bgLayer.clientHeight;

            currentCols = Math.ceil(Math.sqrt(count * (availW / availH)));
            currentRows = Math.ceil(count / currentCols);
            const cellSize = Math.min(availW / currentCols, availH / currentRows);

            bgLayer.style.gridTemplateColumns = `repeat(${currentCols}, ${cellSize}px)`;
            
            for (let i = 0; i < count; i++) {
                const icon = document.createElement('img');
                icon.src = config.bgImagePath;
                icon.className = 'bg-icon';
                bgLayer.appendChild(icon);
            }
        }

        async function saveDirectToSSD() {
            const count = parseInt(config.currentValue);
            const canvas = document.createElement('canvas');
            canvas.width = config.baseSize * currentCols;
            canvas.height = config.baseSize * currentRows;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = config.bgImagePath;

            img.onload = async () => {
                for (let i = 0; i < count; i++) {
                    ctx.drawImage(img, (i % currentCols) * config.baseSize, Math.floor(i / currentCols) * config.baseSize, config.baseSize, config.baseSize);
                }

                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: `NT_Map_${count}pcs.png`,
                        types: [{ description: 'PNG Image', accept: { 'image/png': ['.png'] } }]
                    });
                    const writable = await handle.createWritable();
                    canvas.toBlob(async (blob) => {
                        await writable.write(blob);
                        await writable.close();
                        alert("SSDに保存完了！");
                    }, 'image/png');
                } catch (e) { console.error("保存失敗:", e); }
            };
        }

        function changeValue(val) {
            config.currentValue = val;
            updateCounter();
        }

        window.addEventListener('resize', updateCounter);
        window.onload = updateCounter;
    </script>
</body>
</html>
