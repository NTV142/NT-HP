<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NT-Map-Generator-V3</title>
    <style>
        :root { --bg-color: #fe027f; --bar-height: 75px; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; font-family: sans-serif;
            /* iOS/Androidのスクロール跳ね返り防止 */
            position: fixed; 
        }
        
        #main-container {
            position: relative; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            display: flex; flex-direction: column;
        }

        /* 画像表示エリア：バーの高さ分をあらかじめ引く */
        #view-area {
            width: 100%;
            height: calc(100% - var(--bar-height));
            display: grid; opacity: 0.8; z-index: 1; overflow: hidden;
        }
        .bg-icon { width: 100%; height: 100%; object-fit: contain; }

        /* 下部UIバー：position: fixedで最前面に固定 */
        #ui-bar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%; height: var(--bar-height);
            background: rgba(0, 0, 0, 0.95);
            display: flex; align-items: center; justify-content: space-around;
            z-index: 100; border-top: 2px solid #444;
            padding-bottom: env(safe-area-inset-bottom); /* iPhone等の画面下部余白対策 */
        }

        .input-group { display: flex; align-items: center; gap: 10px; color: white; }
        
        input[type="number"] {
            width: 70px; height: 45px; font-size: 20px; text-align: center;
            border: none; border-radius: 6px; background: #fff; color: #000;
        }

        button {
            height: 45px; padding: 0 15px; font-weight: bold; cursor: pointer;
            border: none; border-radius: 6px; transition: 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-val { background: #444; color: white; font-size: 24px; width: 50px; }
        .btn-dl { background: #00ff00; color: black; font-size: 16px; min-width: 100px; }
        
        button:active { transform: scale(0.92); opacity: 0.7; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="view-area"></div>

        <div id="ui-bar">
            <div class="input-group">
                <button class="btn-val" onclick="changeValue(-1)">-</button>
                <input type="number" id="num-input" value="15" min="1" oninput="setVal(this.value)">
                <button class="btn-val" onclick="changeValue(1)">+</button>
            </div>
            <button class="btn-dl" onclick="saveDirectToSSD()">SSD保存</button>
        </div>
    </div>

    <script>
        const config = { currentValue: 15, bgImagePath: './image1.jpg', baseSize: 1080 };
        const viewArea = document.getElementById('view-area');
        const numInput = document.getElementById('num-input');
        let currentCols = 0; let currentRows = 0;

        function updateView() {
            viewArea.innerHTML = '';
            const count = parseInt(config.currentValue);
            if (isNaN(count) || count <= 0) return;

            const w = viewArea.clientWidth;
            const h = viewArea.clientHeight;

            // アスペクト比を計算して最適な列・行を決定
            currentCols = Math.ceil(Math.sqrt(count * (w / h)));
            currentRows = Math.ceil(count / currentCols);
            const cellSize = Math.min(w / currentCols, h / currentRows);

            viewArea.style.gridTemplateColumns = `repeat(${currentCols}, ${cellSize}px)`;
            
            for (let i = 0; i < count; i++) {
                const img = new Image();
                img.src = config.bgImagePath;
                img.className = 'bg-icon';
                viewArea.appendChild(img);
            }
        }

        async function saveDirectToSSD() {
            const count = config.currentValue;
            const canvas = document.createElement('canvas');
            canvas.width = config.baseSize * currentCols;
            canvas.height = config.baseSize * currentRows;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = config.bgImagePath;

            img.onload = async () => {
                for (let i = 0; i < count; i++) {
                    ctx.drawImage(img, (i % currentCols) * config.baseSize, Math.floor(i / currentCols) * config.baseSize, config.baseSize, config.baseSize);
                }
                try {
                    // Chrome(PC)ならSSDへ直接
                    if (window.showSaveFilePicker) {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: `NT_Map_${count}pcs.png`,
                            types: [{ description: 'PNG', accept: {'image/png': ['.png']}}]
                        });
                        const writable = await handle.createWritable();
                        canvas.toBlob(async (blob) => {
                            await writable.write(blob);
                            await writable.close();
                            alert("SSD保存完了！");
                        }, 'image/png');
                    } else {
                        // スマホ(SA/SB)は通常のダウンロード
                        const link = document.createElement('a');
                        link.download = `NT_Map_${count}pcs.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }
                } catch (e) {
                    console.log("キャンセルされました");
                }
            };
        }

        function changeValue(n) {
            config.currentValue = Math.max(1, parseInt(config.currentValue) + n);
            numInput.value = config.currentValue;
            updateView();
        }

        function setVal(v) {
            const val = parseInt(v);
            if (!isNaN(val) && val > 0) {
                config.currentValue = val;
                updateView();
            }
        }

        window.addEventListener('resize', updateView);
        window.onload = updateView;
    </script>
</body>
</html>
